name: musify
description: "A Music player application"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.0


dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  image_picker: ^1.2.3
  flutter_riverpod: ^3.4.3
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  my_progress_bar: ^2.1.0
  audio_session: ^0.2.4
  rxdart: ^0.28.0
  cached_network_image: ^4.0.0
  path_provider: ^2.1.6

  # firebase_storage: ^13.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true


